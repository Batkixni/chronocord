version: "3.8"

services:
  # ============================================================================
  # Chronocord Bot & Web Dashboard
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronocord_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ============================================================================
  # Optional Local PostgreSQL Database
  # (If you are using external database like Neon or Supabase, you can disable this)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: chronocord_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronocord
      POSTGRES_PASSWORD: chronocord_secret
      POSTGRES_DB: chronocord
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronocord -d chronocord"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
